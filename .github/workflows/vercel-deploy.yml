# Deploy to Vercel on pushes to staging (QA Preview) or production (live).
# main is tested on localhost. Backup when the Vercel Git webhook misses a push.
# If VERCEL_TOKEN is unset, this workflow skips cleanly — native Vercel Git
# integration still deploys.
#
# Optional GitHub secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN          — https://vercel.com/account/tokens (enables this workflow)
#   VERCEL_ORG_ID         — team_… from .vercel/project.json
#   VERCEL_PROJECT_ID     — prj_… from .vercel/project.json
name: Vercel Deploy

on:
  push:
    branches: [staging, production]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: emits a boolean for whether the Vercel token is configured.
  # The `secrets` context is NOT available in a job-level `if`, so testing it
  # there is a workflow-file error that fails every run in 0s instead of
  # skipping — route it through a job output like ios-testflight.yml does.
  # Only the boolean is written; the secret value never appears in logs.
  check-secrets:
    if: ${{ github.ref_name == 'staging' || github.ref_name == 'production' }}
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: echo "configured=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check-secrets
    if: ${{ (github.ref_name == 'staging' || github.ref_name == 'production') && needs.check-secrets.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || github.ref_name == 'staging' && 'staging' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - run: npm run lockfile:verify

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: |
          if [ "$GITHUB_REF_NAME" = "production" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          elif [ "$GITHUB_REF_NAME" = "staging" ]; then
            vercel pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Require non-production pulls to use the dev/test database
        if: ${{ github.ref_name != 'production' }}
        run: |
          ENV_FILE=".vercel/.env.preview.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "missing $ENV_FILE after vercel pull" >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          . "$ENV_FILE"
          set +a
          node scripts/assert-nonprod-supabase-url.mjs

      - name: Build
        run: |
          if [ "$GITHUB_REF_NAME" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        run: |
          if [ "$GITHUB_REF_NAME" = "production" ]; then
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi

  git-integration:
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.configured != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Vercel Git deploy only
        run: |
          echo "::notice::VERCEL_TOKEN is not set — skipping CLI deploy job."
          echo "staging → staging-prop-lane.space and production → prop-lane.space still deploy via the Vercel Git integration. main uses localhost."
