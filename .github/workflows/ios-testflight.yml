name: iOS TestFlight

# Ship a new TestFlight build on every push to production (the live branch —
# staging is QA, main uses localhost), and on demand. The macOS job self-skips
# until the App Store Connect API key secrets exist, so adding this file never
# produces a red run.
#
# "Ship" means INSTALLABLE, not merely uploaded: the run is only green once the
# build has been assigned to the internal tester group and that assignment has
# been read back from the App Store Connect API. See the distribute step below
# and docs/mobile-app.md.
#
# It then makes the App Store follow: the build is attached to the editable
# store version, the product page is synced from app-store/ (screenshots +
# copy), and the version is submitted for review with release-after-approval.
# The store step holds (green, and says so) while Apple is already reviewing a
# version; the 6-hourly `release` catch-up submits the newest processed build
# once the queue clears. scripts/ios-app-store-release.mjs owns the details.
on:
  push:
    branches: [production]
  schedule:
    # Catch-up: submit a build that was parked behind a review. Same job as
    # workflow_dispatch mode=release.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Action to run
        required: true
        default: testflight
        type: choice
        options:
          - testflight
          - release
          - metadata
          - audit
          - subscriptions
      dry_run:
        description: "release only: print every App Store Connect write without making it"
        required: false
        default: false
        type: boolean
      force_resubmit:
        description: "release only: resubmit a version Apple rejected (after you fixed it)"
        required: false
        default: false
        type: boolean

concurrency:
  # Serialize binary uploads and store submissions so two pushes cannot race for
  # one build number or one review, while allowing metadata/catalog maintenance
  # to proceed during Apple's independent build-processing wait.
  group: ios-${{ github.event_name == 'workflow_dispatch' && contains('metadata audit subscriptions', inputs.mode) && 'app-store-maintenance' || 'testflight' }}
  cancel-in-progress: false

jobs:
  # Cheap Ubuntu gate: emits a boolean for whether the API key is configured.
  # Only the boolean is written — the secret value never appears in logs.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: echo "configured=${{ secrets.ASC_KEY_ID != '' }}" >> "$GITHUB_OUTPUT"

  app-store-metadata:
    needs: check-secrets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'metadata' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require App Store Connect credentials
        if: ${{ needs.check-secrets.outputs.configured != 'true' }}
        run: |
          echo "App Store metadata cannot be updated because ASC_KEY_ID is not configured." >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Append and verify App Store legal links
        run: node scripts/ios-app-store-metadata.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

  app-store-audit:
    needs: check-secrets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require App Store Connect credentials
        if: ${{ needs.check-secrets.outputs.configured != 'true' }}
        run: |
          echo "App Store audit cannot run because ASC_KEY_ID is not configured." >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Audit App Store submission and subscription catalog
        run: node scripts/ios-app-store-audit.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

  app-store-subscriptions:
    needs: check-secrets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'subscriptions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require App Store Connect credentials
        if: ${{ needs.check-secrets.outputs.configured != 'true' }}
        run: |
          echo "App Store subscription provisioning cannot run because ASC_KEY_ID is not configured." >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Provision and verify annual App Store subscriptions
        run: node scripts/ios-app-store-provision-annual.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

  # The catch-up: no build, no upload — release the newest processed build to
  # the App Store if nothing is in review. Runs on the schedule and on demand.
  app-store-release:
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.configured == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The schedule fires on the default branch. The store page (app-store/)
      # must come from what is live, so the catch-up always reads production;
      # a manual dispatch keeps the ref the operator chose (dry runs from a lane).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'production' || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Submit the newest processed build to App Store review
        run: node scripts/ios-app-store-release.mjs --latest-build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_STORE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          APP_STORE_FORCE_RESUBMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_resubmit || 'false' }}

  testflight:
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.configured == 'true' && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'testflight') }}
    # macos-26 → Xcode 26 / iOS 26 SDK, which Apple now requires for uploads.
    # Public repo → free macOS minutes.
    runs-on: macos-26
    # Build + upload runs ~4 min; the rest of the budget is the bounded wait for
    # Apple's build processing before the build can be assigned to a group.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Capacitor CLI requires Node >= 22; use 24 to match Vercel and local
          # dev (the npm 11 lockfile fails `npm ci` under node 22's npm 10).
          node-version: "24"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Sync Capacitor (iOS, production URL)
        # Mirror npm run cap:prod (clear .cap-dev-server + prod CAP_SERVER_URL)
        # but sync iOS only — Android is not built on this runner.
        run: |
          rm -f .cap-dev-server
          npx cap sync ios
        env:
          CAP_SERVER_URL: https://proplane.ai

      - name: Verify SPM lockfile matches CapApp-SPM
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          git diff --exit-code ios/App/CapApp-SPM/Package.swift \
            ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Verify Release config points at production
        run: CONFIGURATION=Release bash scripts/verify-cap-prod-config.sh

      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/App

      # The marketing version comes from App Store Connect, not from a hand edit
      # in Xcode: the highest version Apple has seen plus one patch (Xcode's value
      # is a floor for a deliberate minor/major bump). A released train can no
      # longer reject the upload.
      - name: Resolve App Store version
        id: version
        # Assign first so a planner failure fails the step; inside `echo` it would
        # be swallowed and fastlane would build on an empty version.
        run: |
          marketing_version="$(node scripts/ios-app-store-release.mjs --plan-version)"
          test -n "$marketing_version"
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      - name: Build + upload to TestFlight
        id: upload
        working-directory: ios/App
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}

      # An uploaded build with an empty Groups column is not installable by
      # anyone. This step is the real ship gate: it waits for Apple's processing,
      # assigns the build to the internal group, and then re-reads the App Store
      # Connect API to prove the assignment stuck. It fails the run otherwise, so
      # a green "iOS TestFlight" now means a tester can actually install it.
      - name: Distribute build to internal TestFlight group
        timeout-minutes: 30
        run: node scripts/ios-testflight-distribute.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TESTFLIGHT_BUILD_NUMBER: ${{ steps.upload.outputs.build_number }}

      # The App Store half. Attaches the (now processed) build to the editable
      # store version, syncs screenshots + copy from app-store/, submits for
      # review, and reads back WAITING_FOR_REVIEW. Holds, green, when Apple is
      # already reviewing a version — the scheduled catch-up finishes the job.
      - name: Submit to App Store review
        timeout-minutes: 20
        run: node scripts/ios-app-store-release.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TESTFLIGHT_BUILD_NUMBER: ${{ steps.upload.outputs.build_number }}
