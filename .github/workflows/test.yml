name: Load-time focused unit control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Preserve payment-return assertions across isolated autosave queues
        run: |
          for attempt in 1 2 3; do
            npx vitest run tests/unit/rental-wizard-public-resume.test.tsx --maxWorkers=1 --no-file-parallelism
          done
        env:
          NODE_OPTIONS: --max-old-space-size=768
      - run: npx eslint tests/unit/rental-wizard-public-resume.test.tsx
